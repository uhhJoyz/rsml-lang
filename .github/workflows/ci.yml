# scripts/check_all.sh on Linux and macOS, the checks that need
# rust-analyzer or Vim, the oldest supported Rust (rust-version), and once a
# week the long corpus and fuzz runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check_all --quick (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check_all.sh --quick
      - name: Logs of the checks
        if: failure()
        run: |
          for f in target/check-all/*.log; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  editors:
    name: rust-analyzer and Vim checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y vim
      - run: python3 scripts/check_spans.py
      - run: python3 scripts/check_completion.py
      - run: python3 scripts/check_highlight.py
      - run: python3 scripts/check_format_lsp.py
      - run: scripts/check_vim.sh

  msrv:
    name: Rust 1.88 (rust-version)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  long:
    name: corpus with every config, long fuzz run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: CORPUS_ALL=1 cargo test --release -p rsml-fmt --test corpus
      - run: scripts/fuzz.sh
