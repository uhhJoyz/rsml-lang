[package]
name = "rsml-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The OCaml-to-Rust translator behind rsml's macros: lexer, parser and code generator"
license = "MIT"
repository = "https://github.com/uhhJoyz/rsml-lang"
keywords = ["ocaml", "parser", "transpiler", "macro"]
categories = ["compilers", "parser-implementations"]

[dependencies]
# `span-locations` lets the lexer see whitespace between tokens, which is how
# `x.len()` (method call) is told apart from `r.f (x)` (field, then application).
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0"
